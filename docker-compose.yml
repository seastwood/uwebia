services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-uwebia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-uwebia}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uwebia} -d ${POSTGRES_DB:-uwebia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Default: pull the prebuilt image published by GitHub Actions on
    # every push to `main`. To build locally instead (when modifying the
    # source), comment out `image:` and uncomment `build: .`.
    image: setheastwood/uwebia:latest
    # build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # SQLAlchemy connection string. The app reads DATABASE_URL when
      # db_config.json is absent (which it will be on a fresh volume).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-uwebia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uwebia}
      # Flask session/token signing key (the app reads SECRET_KEY). MUST be set in
      # .env for production — it also derives the encryption key for stored
      # credentials, so changing it re-logs-in everyone and requires re-entering
      # Stripe/SMS/AI/OAuth keys in the admin UI.
      SECRET_KEY:   ${SECRET_KEY:?set SECRET_KEY in .env}
      # Which upstreams may set X-Forwarded-For. Defaults to `private`, which
      # covers a proxy container on the compose network or one on the LAN.
      # Cloudflare users want e.g. `10.0.0.5,cloudflare`. See .env.example.
      UWEBIA_TRUSTED_PROXIES: ${UWEBIA_TRUSTED_PROXIES:-private}
      # Keep uploaded GeoIP databases on the volume mounted below.
      UWEBIA_GEOIP_DIR: /app/geoip
      # Optional: tune gunicorn from .env without rebuilding.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      # User uploads persist across container rebuilds.
      - uploads_data:/app/static/uploads
      # The app rewrites config/server.json and config/db_config.json at
      # runtime, so they need a volume too — otherwise admin-UI changes
      # are lost on rebuild.
      - config_data:/app/config
      # Uploaded GeoIP .mmdb databases. Without this they live only in the
      # container's writable layer and vanish on every rebuild, while the
      # database keeps pointing at them — location lookup then silently stops.
      - geoip_data:/app/geoip
    # Publish the app port to the host. pfSense HAProxy (or any other
    # upstream proxy) can then reach the container at <docker-host>:5772.
    # Override the public-facing port via APP_HOST_PORT in .env if 5772
    # is taken on the host. Bind to 127.0.0.1 (LISTEN_ADDR=127.0.0.1) if
    # the proxy lives on the SAME host and shouldn't be reachable from
    # the LAN; bind to 0.0.0.0 (default) if pfSense is a separate box.
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${APP_HOST_PORT:-5772}:5772"

  # ── Optional Caddy reverse proxy ───────────────────────────────────────
  # Disabled by default. Enable with `docker compose --profile caddy up`.
  # Skip it entirely when fronting the app with pfSense HAProxy, Nginx,
  # Cloudflare, etc. — they reach the app on the published port above.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL:   ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  config_data:
  geoip_data:
  caddy_data:
  caddy_config:
